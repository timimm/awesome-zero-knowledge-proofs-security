name: ci
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - name: Prepare MkDocs source directory
        run: |
          rm -rf .mkdocs-docs
          mkdir -p .mkdocs-docs
          cp README.md .mkdocs-docs/README.md
          cp check_list.md .mkdocs-docs/check_list.md
          cp -R "Architectural Design Flaws" .mkdocs-docs/
          cp -R "Circuits Bugs" .mkdocs-docs/
          cp -R "Proving System Bugs" .mkdocs-docs/
          cp -R Assets .mkdocs-docs/
      - run: mkdocs gh-deploy --force
